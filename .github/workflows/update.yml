
name: BAGEN Keiba Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: bagen-keiba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run BAGEN prediction engine
        run: python bot.py

      - name: Check generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for filename in [
              "docs/data.json",
              "docs/history.json",
          ]:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing file: {filename}")
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"JSON OK: {filename}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update BAGEN racing data"
            git push
          fi
