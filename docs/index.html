<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./IMG_6215.jpeg">
<link rel="icon" href="./IMG_6215.jpeg">
<title>馬玄 BAGEN｜中央・地方競馬 予想＆結果</title>
<style>
:root {
  --bg:#07101d;
  --panel:#101d30;
  --panel-border:#233750;
  --gold:#efcb72;
  --gold-bg:#2d2414;
  --text:#f5f7fb;
  --muted:#a2b1c6;
  --line:#21324a;
  --green:#70e0ae;
  --red:#ff8794;
  --blue:#79b8ff;
  --blue-bg:#122238;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:40px;
}
button { font:inherit; }
header {
  padding:12px 14px;
  background:#081321;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.brand { display:flex; align-items:center; gap:9px; min-width:0; }
.logo-img {
  width:36px;
  height:36px;
  flex-shrink:0;
  border-radius:8px;
  object-fit:cover;
  border:1px solid var(--gold);
}
.brand-title {
  font-size:16px;
  font-weight:900;
  letter-spacing:.4px;
  white-space:nowrap;
}
.header-actions {
  display:flex;
  align-items:center;
  gap:6px;
}
.pv {
  font-size:10px;
  color:var(--muted);
  background:#14243a;
  padding:5px 7px;
  border-radius:6px;
  border:1px solid var(--line);
  white-space:nowrap;
}
.refresh-btn {
  background:#14243a;
  border:1px solid var(--panel-border);
  color:var(--text);
  padding:8px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
.refresh-btn:disabled { opacity:.6; }
main {
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:14px 12px;
}
.panel {
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:14px;
  padding:14px;
  margin-bottom:16px;
}
.panel-title {
  font-size:13px;
  font-weight:900;
  margin-bottom:10px;
  color:var(--gold);
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.metric {
  min-width:0;
  padding:12px 10px;
  background:#091525;
  border-radius:10px;
  border:1px solid var(--line);
}
.metric-label {
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}
.metric-val {
  font-size:clamp(17px,4.5vw,22px);
  font-weight:900;
  margin-top:5px;
  overflow-wrap:anywhere;
}
.metric-val.pos { color:var(--green); }
.metric-val.neg { color:var(--red); }
.filter-group {
  display:flex;
  gap:6px;
  margin-bottom:10px;
  overflow-x:auto;
  padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
}
.filter-btn {
  background:#14243a;
  border:1px solid var(--line);
  color:var(--muted);
  padding:9px 13px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
  flex-shrink:0;
}
.filter-btn.active {
  background:var(--gold);
  color:#17130a;
  border-color:var(--gold);
}
.status-message {
  text-align:center;
  padding:28px 14px;
  color:var(--muted);
  background:#0d1829;
  border:1px solid var(--line);
  border-radius:12px;
  line-height:1.8;
  font-size:13px;
}
.status-message.error { color:var(--red); }
.racegrid {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:12px;
}
.race-card {
  min-width:0;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  background:#0d1829;
  overflow:hidden;
}
.race-card.finished {
  border-color:#213045;
  background:#09111c;
}
.race-header {
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:7px;
}
.race-heading { min-width:0; }
.race-title {
  font-size:15px;
  font-weight:900;
  line-height:1.5;
  margin:4px 0 0;
  overflow-wrap:anywhere;
}
.tag-cat {
  display:inline-block;
  font-size:10px;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:3px 6px;
  border-radius:4px;
  white-space:nowrap;
}
.badge-status {
  flex-shrink:0;
  font-size:10px;
  padding:4px 6px;
  border-radius:4px;
  font-weight:900;
  white-space:nowrap;
}
.badge-status.upcoming {
  background:#183e29;
  color:var(--green);
}
.badge-status.finished {
  background:#223247;
  color:var(--muted);
}
.race-meta {
  font-size:11px;
  color:var(--muted);
  margin-bottom:8px;
  line-height:1.7;
  overflow-wrap:anywhere;
}
.box-section {
  border-radius:10px;
  padding:10px;
  margin-top:8px;
  font-size:12px;
  line-height:1.75;
  overflow-wrap:anywhere;
}
.box-top3 {
  background:var(--gold-bg);
  border:1px solid #574421;
}
.box-outsider {
  background:var(--blue-bg);
  border:1px solid #23436d;
  color:var(--blue);
}
.box-ticket-a {
  background:#142236;
  border:1px solid #2d4568;
}
.box-ticket-b {
  background:#221730;
  border:1px solid #523475;
}
.box-result {
  background:#11281e;
  border:1px solid #235238;
}
.ticket-line {
  margin-top:4px;
  font-size:12px;
  font-weight:700;
  line-height:1.7;
}
.empty-note {
  color:var(--muted);
  font-size:12px;
}
.footer-note {
  margin-top:18px;
  text-align:center;
  color:#7789a2;
  font-size:10px;
  line-height:1.7;
}
@media(min-width:680px) {
  .grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .racegrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  main { padding:18px 16px; }
}
@media(max-width:370px) {
  header { padding:10px 8px; }
  .brand { gap:6px; }
  .brand-title { font-size:14px; }
  .logo-img { width:31px; height:31px; }
  .pv { font-size:9px; padding:5px; }
  .refresh-btn { padding:7px; font-size:10px; }
  main { padding:10px 8px; }
  .panel { padding:10px; }
  .race-card { padding:10px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img
      src="./IMG_6215.jpeg"
      alt="馬玄"
      class="logo-img"
      onerror="this.style.display='none'"
    >
    <div class="brand-title">馬玄 BAGEN</div>
  </div>
  <div class="header-actions">
    <div class="pv">👁️ <span id="pv-count">—</span> PV</div>
    <button class="refresh-btn" id="refresh-btn" type="button" onclick="init()">
      ↻ 更新
    </button>
  </div>
</header>
<main>
  <section class="panel">
    <div class="panel-title">📊 投資・回収シミュレーション実績</div>
    <div class="grid">
      <div class="metric">
        <div class="metric-label">累計投資額</div>
        <div class="metric-val" id="stake">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">累計回収額</div>
        <div class="metric-val" id="return">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">回収率</div>
        <div class="metric-val" id="roi">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">単勝的中率</div>
        <div class="metric-val" id="hitrate">—</div>
      </div>
    </div>
    <div class="footer-note">
      シミュレーション上の集計値です。実際の馬券購入・利益を示すものではありません。
    </div>
  </section>
  <section>
    <div class="filter-group" id="tab-filters">
      <button class="filter-btn active" type="button" onclick="setTab('today',this)">
        本日発走レース
      </button>
      <button class="filter-btn" type="button" onclick="setTab('tomorrow',this)">
        🔥 翌日おすすめメイン
      </button>
    </div>
    <div class="filter-group" id="category-filters">
      <button class="filter-btn active" type="button" onclick="setCategory('all',this)">
        すべて
      </button>
      <button class="filter-btn" type="button" onclick="setCategory('central',this)">
        中央競馬
      </button>
      <button class="filter-btn" type="button" onclick="setCategory('local',this)">
        地方競馬
      </button>
    </div>
    <div id="races" class="racegrid">
      <div class="status-message">データを読み込み中…</div>
    </div>
  </section>
  <div class="footer-note">
    馬玄 BAGEN｜予想情報は参考情報です。的中・利益を保証するものではありません。
  </div>
</main>
<script>
'use strict';
let data = null;
let currentTab = 'today';
let currentCat = 'all';
let loading = false;
const $ = id => document.getElementById(id);
function textValue(value, fallback='') {
  if (value === null || value === undefined || value === '') return fallback;
  return String(value);
}
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}
function numberValue(value, fallback=0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}
function yen(value) {
  return Math.round(numberValue(value)).toLocaleString('ja-JP') + '円';
}
function setTab(tab, button) {
  currentTab = tab;
  $('tab-filters').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  render();
}
function setCategory(category, button) {
  currentCat = category;
  $('category-filters').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  render();
}
function horseNumber(horse) {
  return textValue(horse?.number ?? horse?.horse_no, '—');
}
function horseName(horse) {
  return textValue(horse?.name ?? horse?.horse, '馬名未取得');
}
function renderHorse(horse, index) {
  const number = escapeHTML(horseNumber(horse));
  const name = escapeHTML(horseName(horse));
  const oddsValue = horse?.odds;
  const odds = oddsValue === null || oddsValue === undefined || oddsValue === ''
    ? '—'
    : escapeHTML(oddsValue);
  return '<div>' + (index + 1) + '位：馬番 ' + number + ' ' + name +
    '（単勝 ' + odds + '倍）</div>';
}
function renderRace(race) {
  const r = race || {};
  const top3 = Array.isArray(r.top5) ? r.top5.slice(0, 3) : [];
  const isFinished = r.is_finished === true;
  const category = r.category === 'local' ? '地方' : '中央';
  const raceNo = escapeHTML(textValue(r.race_no, ''));
  const raceName = escapeHTML(textValue(r.name, 'レース名未取得'));
  const course = escapeHTML(textValue(r.course, '競馬場未取得'));
  const postTime = escapeHTML(textValue(r.post_time, '未取得'));
  let ticketHTML = '';
  const tickets = Array.isArray(r.tickets) ? r.tickets : [];
  if (tickets.length) {
    ticketHTML = tickets.map(ticket => {
      const t = ticket || {};
      const lines = Array.isArray(t.lines) ? t.lines : [];
      const isB = t.pattern_type === 'B' ||
        textValue(t.pattern).includes('パターンB');
      const boxClass = isB ? 'box-ticket-b' : 'box-ticket-a';
      const accent = isB ? 'var(--red)' : 'var(--gold)';
      const pattern = escapeHTML(textValue(t.pattern, '買い目配分'));
      const note = escapeHTML(textValue(t.note, ''));
      const lineHTML = lines.length
        ? lines.map(line => '<div class="ticket-line">• ' +
            escapeHTML(line) + '</div>').join('')
        : '<div class="empty-note">買い目データはありません。</div>';
      return '<div class="box-section ' + boxClass + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">' +
          '<b style="color:' + accent + '">🎯 シミュレーション買い目</b>' +
          '<span style="color:' + accent + ';font-weight:900;font-size:10px">' +
            pattern + '</span>' +
        '</div>' +
        lineHTML +
        (note ? '<div style="margin-top:7px;font-size:11px;color:var(--muted)">💡 ' + note + '</div>' : '') +
      '</div>';
    }).join('');
  }
  let resultHTML = '';
  if (isFinished) {
    const finishes = Array.isArray(r.result_finishes) ? r.result_finishes : [];
    let formattedResult = '結果データ確認中';
    if (finishes.length >= 3) {
      formattedResult = '1着：' + escapeHTML(finishes[0]) +
        '番 / 2着：' + escapeHTML(finishes[1]) +
        '番 / 3着：' + escapeHTML(finishes[2]) + '番';
    } else if (finishes.length > 0) {
      formattedResult = finishes.map((finish, i) =>
        (i + 1) + '着：' + escapeHTML(finish) + '番'
      ).join(' / ');
    }
    const hitText = r.win_hit === true
      ? '<span style="color:var(--green);font-weight:900">🎯 的中</span>'
      : r.win_hit === false
        ? '<span style="color:var(--red)">❌ 不的中</span>'
        : '<span style="color:var(--muted)">判定中</span>';
    const cost = numberValue(r.race_cost, 0);
    const ret = numberValue(r.win_return, 0);
    const profit = numberValue(r.race_profit, ret - cost);
    const profitColor = profit >= 0 ? 'var(--green)' : 'var(--red)';
    const profitSign = profit > 0 ? '+' : '';
    resultHTML =
      '<div class="box-section box-result">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">' +
          '<b style="color:var(--green)">🏁 レース結果</b>' +
          hitText +
          '<b style="color:' + profitColor + '">収支：' + profitSign + yen(profit) + '</b>' +
        '</div>' +
        '<div style="margin-bottom:5px"><b>確定着順：</b>' + formattedResult + '</div>' +
        '<div style="font-size:11px;color:var(--muted)">投資：' +
          yen(cost) + ' / 回収：' + yen(ret) + '</div>' +
      '</div>';
  }
  const topHTML = top3.length
    ? top3.map(renderHorse).join('')
    : '<div class="empty-note">予想データを準備中です。</div>';
  const outsiders = Array.isArray(r.outsiders) ? r.outsiders : [];
  const outsiderHTML = outsiders.length
    ? '<div class="box-section box-outsider"><b>💡 注目期待値穴馬</b><div style="margin-top:4px">' +
      outsiders.map(h => escapeHTML(h?.name ?? h?.horse ?? '馬名未取得')).join('、') +
      '</div></div>'
    : '';
  return '<article class="race-card ' + (isFinished ? 'finished' : '') + '">' +
    '<div class="race-header">' +
      '<div class="race-heading">' +
        '<span class="tag-cat">' + category + '競馬</span>' +
        '<h3 class="race-title">' + raceNo + 'R ' + raceName + '</h3>' +
      '</div>' +
      '<span class="badge-status ' + (isFinished ? 'finished' : 'upcoming') + '">' +
        (isFinished ? 'レース終了' : '発走前') +
      '</span>' +
    '</div>' +
    '<div class="race-meta">' + course + '｜発走：' + postTime + '</div>' +
    '<div class="box-section box-top3">' +
      '<div style="font-weight:900;color:var(--gold);margin-bottom:5px">🔥 予想上位馬</div>' +
      topHTML +
    '</div>' +
    outsiderHTML +
    ticketHTML +
    resultHTML +
  '</article>';
}
function renderStats() {
  const stats = data?.paper_betting?.stats;
  if (!stats || typeof stats !== 'object') {
    $('stake').textContent = '—';
    $('return').textContent = '—';
    $('roi').textContent = '—';
    $('hitrate').textContent = '—';
    $('return').className = 'metric-val';
    $('roi').className = 'metric-val';
    return;
  }
  const stake = numberValue(stats.total_stake_yen, 0);
  const ret = numberValue(stats.total_return_yen, 0);
  const roi = numberValue(stats.roi_pct, 0);
  const hitRate = numberValue(stats.win_hit_rate_pct, 0);
  $('stake').textContent = yen(stake);
  $('return').textContent = yen(ret);
  $('return').className = 'metric-val ' + (ret > 0 ? 'pos' : '');
  $('roi').textContent = roi.toFixed(1) + '%';
  $('roi').className = 'metric-val ' +
    (roi >= 100 ? 'pos' : (roi > 0 ? '' : 'neg'));
  $('hitrate').textContent = hitRate.toFixed(1) + '%';
}
function render() {
  const container = $('races');
  if (!data || typeof data !== 'object') {
    container.innerHTML =
      '<div class="status-message error">データがありません。GitHub Actionsの実行結果を確認してください。</div>';
    return;
  }
  renderStats();
  const list = currentTab === 'today'
    ? data.races
    : data.tomorrow_races;
  const targetList = Array.isArray(list) ? list : [];
  const filtered = targetList.filter(race => {
    if (currentCat !== 'all' && race?.category !== currentCat) return false;
    return true;
  });
  if (!filtered.length) {
    container.innerHTML =
      '<div class="status-message">該当するレースはありません。<br>' +
      'データ更新後も表示されない場合は、bot.pyの取得結果を確認してください。</div>';
    return;
  }
  container.innerHTML = filtered.map(renderRace).join('');
}
async function updatePV() {
  try {
    const response = await fetch(
      'https://counterapi.dev/v1/bagen-keiba-app/visits/up',
      { cache: 'no-store' }
    );
    if (!response.ok) throw new Error('PV service unavailable');
    const result = await response.json();
    if (result && result.count !== undefined) {
      $('pv-count').textContent =
        numberValue(result.count, 0).toLocaleString('ja-JP');
    }
  } catch (error) {
    // PVカウンターが失敗しても競馬データの表示には影響させない
    $('pv-count').textContent = '—';
  }
}
async function fetchJSON(path) {
  const response = await fetch(path + '?t=' + Date.now(), {
    cache: 'no-store'
  });
  if (!response.ok) {
    throw new Error(path + ' HTTP ' + response.status);
  }
  return await response.json();
}
async function init() {
  if (loading) return;
  loading = true;
  const button = $('refresh-btn');
  const container = $('races');
  button.disabled = true;
  button.textContent = '読込中…';
  updatePV();
  if (!data) {
    container.innerHTML =
      '<div class="status-message">データを読み込み中…</div>';
  }
  try {
    let loadedData = null;
    let lastError = null;
    // GitHub Pagesのルートにあるindex.htmlを想定した標準配置
    const paths = ['./docs/data.json', './data.json'];
    for (const path of paths) {
      try {
        loadedData = await fetchJSON(path);
        break;
      } catch (error) {
        lastError = error;
      }
    }
    if (!loadedData || typeof loadedData !== 'object') {
      throw lastError || new Error('有効なJSONデータがありません');
    }
    data = loadedData;
    render();
  } catch (error) {
    console.error('競馬データの読み込みエラー:', error);
    container.innerHTML =
      '<div class="status-message error">' +
      '<b>データを読み込めませんでした。</b><br>' +
      'GitHub Actionsが成功しているか、data.jsonが公開されているか確認してください。' +
      '<br><br><span style="font-size:11px">詳細：' +
      escapeHTML(error?.message || '不明なエラー') +
      '</span></div>';
  } finally {
    loading = false;
    button.disabled = false;
    button.textContent = '↻ 更新';
  }
}
init();
</script>
</body>
</html>
