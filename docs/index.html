<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>馬玄 BAGEN｜競馬予想＆仮想シミュレーション</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--panel:#101d30;--gold:#efcb72;--text:#f5f7fb;--muted:#a2b1c6;--line:#2a3a53;--green:#70e0ae;--red:#ff8794;--blue:#79b8ff}
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:14px 16px;background:#081321;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
main{max-width:1000px;margin:auto;padding:16px 12px 40px}
.panel{background:#101d30;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metric{padding:10px;background:#091525;border-radius:10px;border:1px solid #23354d}
.metric .val{font-size:18px;font-weight:800;margin-top:4px}
.metric .val.pos{color:var(--green)}
.metric .val.neg{color:var(--red)}
.filters button{background:#14243a;border:1px solid var(--line);color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
.filters button.active{background:var(--gold);color:#000}
.racegrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:680px){.grid{grid-template-columns:repeat(4,1fr)}.racegrid{grid-template-columns:repeat(2,1fr)}}
.race{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0f1b2c}
.tag{font-size:10px;border:1px solid var(--gold);color:var(--gold);padding:2px 5px;border-radius:4px}
.ticket-box{background:#1a283d;border:1px solid #3b506e;border-radius:10px;padding:10px;margin-top:10px}
.ticket-title{font-size:11px;color:var(--gold);font-weight:800}
.reason{font-size:9px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<header>
 <b>馬玄 BAGEN</b> <span id="status" style="font-size:11px;color:var(--muted)">読込中…</span>
</header>
<main>
 <section class="panel">
  <h3>📊 リアルタイム仮想投資成績（自動確定照合）</h3>
  <div class="grid">
   <div class="metric"><div>総収支</div><div class="val" id="profit">—</div></div>
   <div class="metric"><div>回収率</div><div class="val" id="roi">—</div></div>
   <div class="metric"><div>単勝的中率</div><div class="val" id="hitrate">—</div></div>
   <div class="metric"><div>仮想残高</div><div class="val" id="balance">—</div></div>
  </div>
 </section>

 <section>
  <div class="filters" style="margin-bottom:10px">
   <button class="active" onclick="setTab('today',this)">本日発走レース</button>
   <button onclick="setTab('tomorrow',this)">🔥 翌日おすすめメイン</button>
  </div>
  <div id="races" class="racegrid"></div>
 </section>
</main>
<script>
let data=null, tab='today';
const $=id=>document.getElementById(id);
const yen=n=>Number(n).toLocaleString()+"円";

function setTab(t, btn){
 tab=t;
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 render();
}

function renderTickets(tickets=[]){
 if(!tickets.length) return '';
 return '<div class="ticket-box"><div class="ticket-title">🎯 推奨買い目 (3連単フォーメーション)</div>'+
 tickets.map(t=>'<div style="font-size:11px;margin-top:4px"><b>1着:</b> '+t.first.join(',')+' → <b>2着:</b> '+t.second.join(',')+' → <b>3着:</b> '+t.third.join(',')+'<br><span style="color:var(--gold)">計 '+t.points+'点 ('+(t.points*100)+'円)</span> <span class="reason">'+t.note+'</span></div>').join('')+'</div>';
}

function renderRace(r){
 return '<article class="race"><div><b>'+r.race_no+'R '+r.name+'</b> <span class="tag">'+(r.category==='local'?'地方':'中央')+'</span></div>'+
 '<div style="font-size:10px;color:var(--muted)">'+r.course+' '+r.surface+' '+(r.distance_m||'')+'m 発走:'+r.post_time+'</div>'+
 '<div style="font-size:11px;margin-top:8px"><b>🏆 本命TOP3:</b> '+r.top5.slice(0,3).map(h=>h.horse_no+'.'+h.name).join(', ')+'</div>'+
 (r.outsiders.length?'<div style="font-size:11px;color:var(--blue);margin-top:4px"><b>⚡ 穴馬注意:</b> '+r.outsiders.map(h=>h.horse_no+'.'+h.name+' ('+h.caution+')').join(' / ')+'</div>':'')+
 renderTickets(r.tickets)+
 '</article>';
}

function render(){
 if(!data) return;
 const list = tab==='today' ? (data.races||[]) : (data.tomorrow_races||[]);
 $('races').innerHTML = list.length ? list.map(renderRace).join('') : '<div style="color:var(--muted)">該当レースはありません</div>';
}

async function init(){
 const res = await fetch('./data.json?v='+Date.now());
 data = await res.json();
 const st = data.paper_betting.stats;
 $('profit').textContent = (st.profit_yen>0?'+':'')+yen(st.profit_yen);
 $('profit').className = 'val '+(st.profit_yen>0?'pos':st.profit_yen<0?'neg':'');
 $('roi').textContent = st.roi_pct+'%';
 $('hitrate').textContent = st.win_hit_rate_pct+'%';
 $('balance').textContent = yen(st.virtual_balance_yen);
 $('status').textContent = '更新完了';
 render();
}
init();
</script>
</body>
</html>
