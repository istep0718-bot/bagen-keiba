<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<!-- iPhoneホーム画面用アイコン設定 -->
<link rel="apple-touch-icon" href="IMG_6215.jpeg">
<link rel="icon" href="IMG_6215.jpeg">
<title>馬玄 BAGEN｜中央・地方競馬 予想＆結果</title>
<style>
:root {
  --bg: #07101d;
  --panel: #101d30;
  --panel-border: #233750;
  --gold: #efcb72;
  --gold-bg: #2d2414;
  --text: #f5f7fb;
  --muted: #a2b1c6;
  --line: #21324a;
  --green: #70e0ae;
  --green-bg: #11281e;
  --red: #ff8794;
  --blue: #79b8ff;
  --blue-bg: #122238;
  --purple-bg: #221730;
  --purple-border: #523475;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding-bottom: 40px;
}
header {
  padding: 12px 16px; background: #081321; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo-img {
  width: 36px; height: 36px; border-radius: 8px;
  object-fit: cover; border: 1px solid var(--gold);
}
.brand-title { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
.refresh-btn {
  background: #14243a; border: 1px solid var(--panel-border);
  color: var(--text); padding: 6px 12px; border-radius: 8px;
  font-size: 11px; font-weight: 700; cursor: pointer;
}
main { max-width: 1000px; margin: auto; padding: 14px 12px; }

/* 投資成績パネルの視認性強化 */
.panel {
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 14px; padding: 14px; margin-bottom: 16px;
}
.panel-title { font-size: 13px; font-weight: 800; margin-bottom: 10px; color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.metric { padding: 12px 10px; background: #091525; border-radius: 10px; border: 1px solid var(--line); }
.metric-label { font-size: 11px; color: var(--muted); font-weight: 600; }
.metric-val { font-size: 19px; font-weight: 900; margin-top: 4px; letter-spacing: 0.3px; }
.metric-val.pos { color: var(--green); }
.metric-val.neg { color: var(--red); }

.filter-group { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.filter-btn {
  background: #14243a; border: 1px solid var(--line); color: var(--muted);
  padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700;
  white-space: nowrap; cursor: pointer;
}
.filter-btn.active { background: var(--gold); color: #17130a; border-color: var(--gold); }

.racegrid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.race-card {
  border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; background: #0d1829; position: relative;
}
.race-card.finished { border-color: #213045; background: #09111c; }
.race-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.race-title { font-size: 15px; font-weight: 800; margin: 0; }
.tag-cat { font-size: 10px; border: 1px solid var(--gold); color: var(--gold); padding: 2px 5px; border-radius: 4px; }
.badge-status { font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 800; }
.badge-status.upcoming { background: #183e29; color: var(--green); }
.badge-status.finished { background: #223247; color: var(--muted); }

.race-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.box-section { border-radius: 10px; padding: 10px; margin-top: 8px; font-size: 11px; line-height: 1.6; }
.box-top3 { background: var(--gold-bg); border: 1px solid #574421; }
.box-outsider { background: var(--blue-bg); border: 1px solid #23436d; color: var(--blue); }

.box-ticket-a { background: #142236; border: 1px solid #2d4568; }
.box-ticket-b { background: var(--purple-bg); border: 1px solid var(--purple-border); }

.box-result { background: var(--green-bg); border: 1px solid #235238; }
.ticket-line { margin-top: 3px; font-size: 11px; font-weight: 600; }

@media(min-width: 680px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
  .racegrid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="IMG_6215.jpeg" alt="馬玄" class="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2236%22><rect width=%22100%22 height=%22100%22 fill=%22%232d2414%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23efcb72%22 font-size=%2218%22 font-weight=%22bold%22>玄</text></svg>'">
    <div class="brand-title">馬玄 BAGEN</div>
  </div>
  <button class="refresh-btn" onclick="init()">↻ データ更新</button>
</header>

<main>
  <section class="panel">
    <div class="panel-title">📊 投資・回収シミュレーション実績</div>
    <div class="grid">
      <div class="metric"><div class="metric-label">累計投資額</div><div class="metric-val" id="stake">—</div></div>
      <div class="metric"><div class="metric-label">累計回収額</div><div class="metric-val" id="return">—</div></div>
      <div class="metric"><div class="metric-label">回収率</div><div class="metric-val" id="roi">—</div></div>
      <div class="metric"><div class="metric-label">単勝的中率</div><div class="metric-val" id="hitrate">—</div></div>
    </div>
  </section>

  <section>
    <div class="filter-group">
      <button class="filter-btn active" onclick="setTab('today', this)">本日発走レース</button>
      <button class="filter-btn" onclick="setTab('tomorrow', this)">🔥 翌日おすすめメイン</button>
    </div>
    <div class="filter-group">
      <button class="filter-btn active" onclick="setCategory('all', this)">すべて</button>
      <button class="filter-btn" onclick="setCategory('central', this)">中央競馬</button>
      <button class="filter-btn" onclick="setCategory('local', this)">地方競馬</button>
    </div>

    <div id="races" class="racegrid">
      <div style="text-align:center; padding:40px; color:var(--muted)">データを読み込み中…</div>
    </div>
  </section>
</main>

<script>
let data = null;
let currentTab = 'today';
let currentCat = 'all';

const $ = id => document.getElementById(id);

function setTab(t, btn) {
  currentTab = t;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setCategory(c, btn) {
  currentCat = c;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function renderRace(r) {
  const top3 = (r.top5 || []).slice(0, 3);
  const isFinished = r.is_finished;

  let ticketHtml = '';
  if (r.tickets && r.tickets.length) {
    const t = r.tickets[0];
    const lines = t.lines || [];
    const isPatternB = (t.pattern_type === 'B' || (t.pattern && t.pattern.includes('パターンB')));
    const ticketBoxClass = isPatternB ? 'box-ticket-b' : 'box-ticket-a';
    const badgeColor = isPatternB ? 'color:var(--red)' : 'color:var(--gold)';
    const badgeBg = isPatternB ? 'background:#361f38' : 'background:#291e0d';

    ticketHtml = '<div class="box-section ' + ticketBoxClass + '">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">' +
        '<b style="' + badgeColor + '">🎯 2,000円マルチ買い目</b>' +
        '<span style="' + badgeColor + '; font-weight:bold; font-size:10px; ' + badgeBg + '; padding:2px 6px; border-radius:4px">' + (t.pattern || '2,000円配分') + '</span>' +
      '</div>' +
      (lines.length ? lines.map(line => '<div class="ticket-line">• ' + line + '</div>').join('') : '') +
      '<div style="margin-top:6px; font-size:10px; color:var(--muted)">💡 ' + (t.note || '') + '</div>' +
    '</div>';
  }

  let resultHtml = '';
  if (isFinished) {
    const finishes = r.result_finishes || [];
    const hitText = r.win_hit === true ? ' <span style="color:var(--green); font-weight:bold">🎯 的中！</span>' : (r.win_hit === false ? ' <span style="color:var(--red)">❌ 不的中</span>' : '');
    
    // 着順テキストを「1着:○番 / 2着:○番 / 3着:○番」と直感的に表示されるよう整形
    let formattedResult = '結果データ確認中';
    if (finishes.length >= 3) {
      formattedResult = `1着: ${finishes[0]}番 / 2着: ${finishes[1]}番 / 3着: ${finishes[2]}番`;
    } else if (finishes.length > 0) {
      formattedResult = finishes.map((f, i) => `${i+1}着: ${f}番`).join(' / ');
    }

    resultHtml = '<div class="box-section box-result">' +
      '<b style="color:var(--green)">🏁 レース確定結果</b>' + hitText + '<br>' +
      '<b>確定着順:</b> ' + formattedResult +
    '</div>';
  }

  return '<article class="race-card ' + (isFinished ? 'finished' : '') + '">' +
    '<div class="race-header">' +
      '<div>' +
        '<span class="tag-cat" style="margin-right:6px">' + (r.category === 'local' ? '地方' : '中央') + '</span>' +
        '<h3 class="race-title" style="display:inline">' + (r.race_no || '') + 'R ' + (r.name || '') + '</h3>' +
      '</div>' +
      '<span class="badge-status ' + (isFinished ? 'finished' : 'upcoming') + '">' +
        (isFinished ? 'レース終了' : '発走前') +
      '</span>' +
    '</div>' +
    '<div class="race-meta">' + (r.course || '') + ' | 発走: ' + (r.post_time || '') + '</div>' +
    '<div class="box-section box-top3">' +
      '<div style="font-weight:bold; color:var(--gold); margin-bottom:4px">🔥 注目上位馬</div>' +
      (top3.length ? top3.map((h, i) => '<div>' + (i+1) + '位: 馬番 ' + (h.number || h.horse_no) + ' ' + (h.name || h.horse) + ' (単勝 ' + (h.odds || '-') + '倍)</div>').join('') : 'データ準備中') +
    '</div>' +
    (r.outsiders && r.outsiders.length > 0 ? '<div class="box-section box-outsider">💡 注目穴馬: ' + r.outsiders.map(o => o.name || o.horse).join(', ') + '</div>' : '') +
    ticketHtml +
    resultHtml +
  '</article>';
}

function render() {
  const container = $('races');
  if (!data) {
    container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted)">データがありません</div>';
    return;
  }

  if (data.paper_betting && data.paper_betting.stats) {
    const s = data.paper_betting.stats;
    const stake = s.total_stake_yen || 0;
    const ret = s.total_return_yen || 0;
    const roi = s.roi_pct || 0;

    $('stake').textContent = stake.toLocaleString() + "円";
    
    const retEl = $('return');
    retEl.textContent = ret.toLocaleString() + "円";
    retEl.className = 'metric-val ' + (ret >= stake ? 'pos' : '');

    const roiEl = $('roi');
    roiEl.textContent = roi.toFixed(1) + '%';
    roiEl.className = 'metric-val ' + (roi >= 100 ? 'pos' : 'neg');

    $('hitrate').textContent = (s.win_hit_rate_pct || 0).toFixed(1) + '%';
  }

  let targetList = (currentTab === 'today') ? (data.races || []) : (data.tomorrow_races || []);
  const filtered = targetList.filter(r => {
    if (currentCat !== 'all' && r.category !== currentCat) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted)">該当するレースはありません</div>';
    return;
  }

  container.innerHTML = filtered.map(renderRace).join('');
}

async function init() {
  const container = $('races');
  container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted)">データを読み込み中…</div>';
  try {
    const res = await fetch('./data.json?t=' + new Date().getTime());
    if (!res.ok) throw new Error('データ取得に失敗しました');
    data = await res.json();
    render();
  } catch (e) {
    container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--red)">データの読み込みに失敗しました</div>';
    console.error(e);
  }
}

init();
</script>
</body>
</html>
