
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./IMG_6215.jpeg">
<link rel="icon" href="./IMG_6215.jpeg">
<title>馬玄 BAGEN｜中央・地方競馬 AI予想</title>
<style>
:root{
--bg:#07101d;--panel:#101d30;--border:#233750;--gold:#efcb72;
--goldbg:#2d2414;--text:#f5f7fb;--muted:#a2b1c6;--line:#21324a;
--green:#70e0ae;--red:#ff8794;--blue:#79b8ff;--bluebg:#122238;
--purple:#d0a0ff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
padding-bottom:35px}
button{font:inherit}
header{padding:11px 13px;background:#081321;border-bottom:1px solid var(--line);
position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;
align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo-img{width:36px;height:36px;flex-shrink:0;border-radius:8px;
object-fit:cover;border:1px solid var(--gold)}
.brand-title{font-size:16px;font-weight:900;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:6px}
.pv{font-size:10px;color:var(--muted);background:#14243a;padding:5px 7px;
border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.refresh-btn{background:#14243a;border:1px solid var(--border);color:var(--text);
padding:8px 10px;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer}
.refresh-btn:disabled{opacity:.6}
main{width:100%;max-width:1000px;margin:0 auto;padding:13px 12px}
.panel{background:var(--panel);border:1px solid var(--border);
border-radius:14px;padding:13px;margin-bottom:14px}
.panel-title{font-size:13px;font-weight:900;margin-bottom:10px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{min-width:0;padding:11px 9px;background:#091525;border-radius:10px;
border:1px solid var(--line)}
.metric-label{font-size:11px;color:var(--muted);font-weight:700}
.metric-val{font-size:clamp(17px,4.5vw,22px);font-weight:900;margin-top:5px;overflow-wrap:anywhere}
.pos{color:var(--green)!important}.neg{color:var(--red)!important}
.filter-group{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:3px;
-webkit-overflow-scrolling:touch}
.filter-btn{background:#14243a;border:1px solid var(--line);color:var(--muted);
padding:9px 12px;border-radius:8px;font-size:12px;font-weight:800;
white-space:nowrap;cursor:pointer;flex-shrink:0}
.filter-btn.active{background:var(--gold);color:#17130a;border-color:var(--gold)}
.status-message{text-align:center;padding:25px 13px;color:var(--muted);
background:#0d1829;border:1px solid var(--line);border-radius:12px;
line-height:1.8;font-size:13px}
.status-message.error{color:var(--red)}
.racegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.race-card{min-width:0;border:1px solid var(--line);border-radius:14px;
padding:12px;background:#0d1829;overflow:hidden}
.race-card.finished{border-color:#213045;background:#09111c}
.race-header{display:flex;justify-content:space-between;align-items:flex-start;
gap:8px;margin-bottom:7px}
.race-heading{min-width:0}
.race-title{font-size:15px;font-weight:900;line-height:1.5;margin:4px 0 0;overflow-wrap:anywhere}
.tag-cat{display:inline-block;font-size:10px;border:1px solid var(--gold);
color:var(--gold);padding:3px 6px;border-radius:4px;white-space:nowrap}
.badge-status{flex-shrink:0;font-size:10px;padding:4px 6px;border-radius:4px;
font-weight:900;white-space:nowrap}
.upcoming{background:#183e29;color:var(--green)}
.finished-badge{background:#223247;color:var(--muted)}
.race-meta{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.7;overflow-wrap:anywhere}
.box-section{border-radius:10px;padding:10px;margin-top:8px;font-size:12px;
line-height:1.75;overflow-wrap:anywhere}
.box-top3{background:var(--goldbg);border:1px solid #574421}
.box-outsider{background:var(--bluebg);border:1px solid #23436d}
.box-longshot{background:#20152b;border:1px solid #54356c}
.box-ticket-a{background:#142236;border:1px solid #2d4568}
.box-ticket-b{background:#221730;border:1px solid #523475}
.box-result{background:#11281e;border:1px solid #235238}
.box-form{background:#101f30;border:1px solid #30445d}
.box-ev{background:#10251f;border:1px solid #275743}
.box-odds{background:#151e32;border:1px solid #344365}
.ticket-line{margin-top:4px;font-size:12px;font-weight:700;line-height:1.7}
.empty-note{color:var(--muted);font-size:12px}
.footer-note{margin-top:17px;text-align:center;color:#7789a2;font-size:10px;line-height:1.8}
.section-heading{font-weight:900;margin-bottom:5px}
.horse-row{padding:7px 0;border-bottom:1px solid #ffffff12}
.horse-row:last-child{border-bottom:0}
.horse-title{font-size:13px;font-weight:900}
.horse-sub{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.65}
.pill{display:inline-block;padding:2px 6px;margin:2px 3px 2px 0;
border-radius:5px;background:#1b2b41;border:1px solid #30445d;
font-size:10px;color:#d8e4f4}
.pill.gold{color:var(--gold);border-color:#574421;background:#2d2414}
.pill.green{color:var(--green);border-color:#275743;background:#10251f}
.pill.red{color:var(--red);border-color:#60313c;background:#2a1720}
.pill.purple{color:var(--purple);border-color:#54356c;background:#20152b}
.mini-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
.mini-table th,.mini-table td{text-align:left;padding:6px 4px;
border-bottom:1px solid #ffffff12;vertical-align:top}
.mini-table th{color:var(--muted);font-weight:700}
.progress{height:6px;background:#27364b;border-radius:99px;overflow:hidden;margin-top:5px}
.progress>span{display:block;height:100%;background:var(--green);border-radius:99px}
@media(min-width:680px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.racegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
main{padding:18px 16px}
}
@media(max-width:370px){
header{padding:9px 7px}.brand{gap:6px}.brand-title{font-size:14px}
.logo-img{width:30px;height:30px}.pv{font-size:9px;padding:5px}
.refresh-btn{padding:7px;font-size:10px}main{padding:9px 7px}
.panel{padding:10px}.race-card{padding:9px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="./IMG_6215.jpeg" alt="馬玄" class="logo-img"
      onerror="this.style.display='none'">
    <div class="brand-title">馬玄 BAGEN</div>
  </div>
  <div class="header-actions">
    <div class="pv">👁️ <span id="pv-count">—</span> PV</div>
    <button class="refresh-btn" id="refresh-btn" type="button" onclick="init()">↻ 更新</button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">📊 紙上シミュレーション実績</div>
    <div class="grid">
      <div class="metric"><div class="metric-label">累計投資額</div><div class="metric-val" id="stake">—</div></div>
      <div class="metric"><div class="metric-label">累計回収額</div><div class="metric-val" id="return">—</div></div>
      <div class="metric"><div class="metric-label">回収率</div><div class="metric-val" id="roi">—</div></div>
      <div class="metric"><div class="metric-label">単勝的中率</div><div class="metric-val" id="hitrate">—</div></div>
    </div>
    <div id="stats-note" class="footer-note">
      払戻を確認できたレースのみ集計。実際の馬券購入・利益ではありません。
    </div>
  </section>

  <section>
    <div class="filter-group" id="tab-filters">
      <button class="filter-btn active" type="button" onclick="setTab('today',this)">本日発走レース</button>
      <button class="filter-btn" type="button" onclick="setTab('tomorrow',this)">🔥 翌日おすすめ</button>
    </div>
    <div class="filter-group" id="category-filters">
      <button class="filter-btn active" type="button" onclick="setCategory('all',this)">すべて</button>
      <button class="filter-btn" type="button" onclick="setCategory('central',this)">中央競馬</button>
      <button class="filter-btn" type="button" onclick="setCategory('local',this)">地方競馬</button>
    </div>
    <div id="data-status" class="footer-note"></div>
    <div id="races" class="racegrid">
      <div class="status-message">データを読み込み中…</div>
    </div>
  </section>

  <div class="footer-note">
    馬玄 BAGEN｜AI評価・推定勝率・期待値は参考情報です。的中・利益を保証しません。
    オッズ変動の記録は、発走前に取得できたデータの範囲で表示します。
  </div>
</main>

<script>
'use strict';
let data=null;
let currentTab='today';
let currentCat='all';
let loading=false;
const $=id=>document.getElementById(id);

function textValue(v,fallback=''){
  if(v===null||v===undefined||v==='')return fallback;
  return String(v);
}
function escapeHTML(v){
  return String(v??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function num(v,fallback=null){
  if(v===null||v===undefined||v==='')return fallback;
  const n=Number(v);
  return Number.isFinite(n)?n:fallback;
}
function yen(v){
  const n=num(v,0);
  return Math.round(n).toLocaleString('ja-JP')+'円';
}
function pct(v,digits=1){
  const n=num(v,null);
  return n===null?'未算出':n.toFixed(digits)+'%';
}
function oddsText(v){
  const n=num(v,null);
  return n===null?'未取得':n.toFixed(1)+'倍';
}
function setTab(tab,button){
  currentTab=tab;
  $('tab-filters').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  render();
}
function setCategory(category,button){
  currentCat=category;
  $('category-filters').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  render();
}
function horseNo(h){
  return textValue(h?.horse_no??h?.number,'—');
}
function horseName(h){
  return textValue(h?.horse??h?.name,'馬名未取得');
}
function horseOdds(h){
  return num(h?.odds,null);
}
function horseRank(h,index){
  return num(h?.rank,index+1);
}
function renderStats(){
  const s=data?.paper_betting?.stats;
  if(!s||typeof s!=='object'){
    ['stake','return','roi','hitrate'].forEach(id=>$(id).textContent='—');
    return;
  }
  const stake=num(s.total_stake_yen,0);
  const ret=num(s.total_return_yen,0);
  const roi=num(s.roi_pct,0);
  const hit=num(s.win_hit_rate_pct,0);
  $('stake').textContent=yen(stake);
  $('return').textContent=yen(ret);
  $('return').className='metric-val '+(ret>0?'pos':'');
  $('roi').textContent=roi.toFixed(1)+'%';
  $('roi').className='metric-val '+(roi>=100?'pos':roi>0?'':'neg');
  $('hitrate').textContent=hit.toFixed(1)+'%';
  const count=num(s.races_settled,0);
  $('stats-note').textContent='確定集計 '+count+'レース｜'+
    textValue(s.accounting_note,'未確定レースは集計対象外です。');
}
function pill(label,kind=''){
  return '<span class="pill '+kind+'">'+escapeHTML(label)+'</span>';
}
function renderHorseLine(h,index){
  const rank=escapeHTML(horseRank(h,index));
  const no=escapeHTML(horseNo(h));
  const name=escapeHTML(horseName(h));
  const odds=horseOdds(h);
  const score=num(h?.score,null);
  const prob=num(h?.win_probability_pct??h?.estimated_win_probability_pct,null);
  const ev=num(h?.expected_return_pct??h?.ev_pct,null);
  const reasons=Array.isArray(h?.reasons)?h.reasons:[];
  let tags='';
  if(prob!==null)tags+=pill('推定勝率 '+prob.toFixed(1)+'%','green');
  if(ev!==null)tags+=pill('期待回収率 '+ev.toFixed(1)+'%',ev>=100?'green':'');
  if(score!==null)tags+=pill('評価 '+score.toFixed(1),'gold');
  return '<div class="horse-row">'+
    '<div class="horse-title">'+rank+'位｜'+no+'番 '+name+'</div>'+
    '<div class="horse-sub">単勝 '+oddsText(odds)+
      '｜人気 '+escapeHTML(textValue(h?.popularity,'未取得'))+
      '｜評価信頼度 '+escapeHTML(textValue(h?.score_confidence,'未算出'))+
      (h?.score_confidence!==undefined?'%':'')+'</div>'+
    (tags?'<div>'+tags+'</div>':'')+
    (reasons.length?'<div class="horse-sub">根拠：'+
      escapeHTML(reasons.slice(0,4).join('／'))+'</div>':'')+
  '</div>';
}
function renderPreviousForm(h){
  const f=h?.previous_race??h?.previous_form??h?.last_race??null;
  if(!f||typeof f!=='object')return '';
  const finish=f.finish_position??f.finish??f.rank;
  const margin=f.time_gap??f.margin??f.gap;
  const passing=f.passing_order??f.corner_positions??f.passing;
  const last3f=f.last_3f??f.final_3f??f.agari_3f;
  const date=f.date??f.race_date;
  const name=f.race_name??f.name;
  const pieces=[];
  if(date)pieces.push('日付 '+textValue(date));
  if(name)pieces.push(textValue(name));
  if(finish!==undefined&&finish!==null)pieces.push('着順 '+textValue(finish)+'着');
  if(margin!==undefined&&margin!==null&&margin!=='')pieces.push('着差 '+textValue(margin));
  if(passing)pieces.push('通過 '+textValue(Array.isArray(passing)?passing.join('-'):passing));
  if(last3f!==undefined&&last3f!==null&&last3f!=='')pieces.push('上がり3F '+textValue(last3f)+'秒');
  if(!pieces.length)return '';
  return '<div class="horse-sub">前走：'+escapeHTML(pieces.join('｜'))+'</div>';
}
function renderValueHorse(h,label,kind){
  const no=escapeHTML(horseNo(h));
  const name=escapeHTML(horseName(h));
  const odds=horseOdds(h);
  const reason=textValue(h?.value_reason??h?.longshot_reason??h?.reason,'');
  const reasons=Array.isArray(h?.reasons)?h.reasons:[];
  const prob=num(h?.win_probability_pct??h?.estimated_win_probability_pct,null);
  const ev=num(h?.expected_return_pct??h?.ev_pct,null);
  return '<div class="horse-row"><div class="horse-title">'+
    pill(label,kind)+' '+no+'番 '+name+'</div>'+
    '<div class="horse-sub">単勝 '+oddsText(odds)+
    (prob!==null?'｜推定勝率 '+prob.toFixed(1)+'%':'')+
    (ev!==null?'｜期待回収率 '+ev.toFixed(1)+'%':'')+'</div>'+
    (reason?'<div class="horse-sub">選定理由：'+escapeHTML(reason)+'</div>':'')+
    (reasons.length?'<div class="horse-sub">根拠：'+escapeHTML(reasons.slice(0,4).join('／'))+'</div>':'')+
    renderPreviousForm(h)+'</div>';
}
function renderEVTable(r){
  const horses=Array.isArray(r.horses)?r.horses:[];
  const rows=horses.filter(h=>
    num(h?.win_probability_pct??h?.estimated_win_probability_pct,null)!==null ||
    num(h?.expected_return_pct??h?.ev_pct,null)!==null
  ).slice(0,8);
  if(!rows.length)return '<div class="empty-note">期待値データ未取得。bot.pyの対応後に表示されます。</div>';
  return '<table class="mini-table"><thead><tr><th>馬</th><th>単勝</th><th>推定勝率</th><th>期待回収率</th></tr></thead><tbody>'+
    rows.map(h=>{
      const p=num(h?.win_probability_pct??h?.estimated_win_probability_pct,null);
      const ev=num(h?.expected_return_pct??h?.ev_pct,null);
      return '<tr><td>'+escapeHTML(horseNo(h))+'番 '+escapeHTML(horseName(h))+'</td>'+
        '<td>'+escapeHTML(oddsText(h?.odds))+'</td>'+
        '<td>'+(p===null?'—':p.toFixed(1)+'%')+'</td>'+
        '<td class="'+(ev!==null&&ev>=100?'pos':'')+'">'+(ev===null?'—':ev.toFixed(1)+'%')+'</td></tr>';
    }).join('')+'</tbody></table>'+
    '<div class="horse-sub">期待回収率＝推定勝率×単勝オッズ×100。推定勝率の精度は検証データに依存します。</div>';
}
function renderOddsMovement(r){
  const snapshots=r?.odds_monitor??r?.odds_trend??r?.odds_snapshots??null;
  if(!snapshots)return '<div class="empty-note">オッズ推移データ未取得。発走前の定期取得後に表示されます。</div>';
  const ten=snapshots.ten_minutes??snapshots.t_minus_10??snapshots['10m']??null;
  const one=snapshots.one_minute??snapshots.t_minus_1??snapshots['1m']??null;
  const current=snapshots.current??snapshots.latest??null;
  function list(value,label){
    if(!value)return '<div class="horse-sub">'+label+'：未取得</div>';
    const arr=Array.isArray(value)?value:(Array.isArray(value.horses)?value.horses:[]);
    if(!arr.length)return '<div class="horse-sub">'+label+'：記録なし</div>';
    return '<div class="horse-sub">'+label+'：'+arr.slice(0,6).map(h=>
      escapeHTML(textValue(h.horse_no??h.number,'?'))+'番 '+escapeHTML(textValue(h.horse??h.name,''))+
      ' '+escapeHTML(oddsText(h.odds))
    ).join('　／　')+'</div>';
  }
  return list(ten,'約10分前')+list(one,'約1分前')+list(current,'最新');
}
function renderTickets(r){
  const tickets=Array.isArray(r?.tickets)?r.tickets:[];
  if(!tickets.length)return '<div class="empty-note">買い目データなし</div>';
  return tickets.map(t=>{
    const isB=t?.pattern_type==='B'||textValue(t?.pattern).includes('パターンB');
    const lines=Array.isArray(t?.lines)?t.lines:[];
    return '<div class="box-section '+(isB?'box-ticket-b':'box-ticket-a')+'">'+
      '<div class="section-heading '+(isB?'':'')+'">'+
      (isB?'🎯 穴馬組み込み型':'🎯 上位評価中心')+
      '｜'+escapeHTML(textValue(t?.pattern,'買い目'))+'</div>'+
      '<div>'+lines.map(line=>'<div class="ticket-line">• '+escapeHTML(line)+'</div>').join('')+
      '</div><div class="horse-sub">投資予定：'+yen(t?.cost_yen??0)+'</div>'+
      (t?.note?'<div class="horse-sub">💡 '+escapeHTML(t.note)+'</div>':'')+
      '</div>';
  }).join('');
}
function renderResult(r){
  if(r?.is_finished!==true)return '';
  const finishes=Array.isArray(r?.result_finishes)?r.result_finishes:[];
  const formatted=finishes.length>=3?
    '1着 '+escapeHTML(finishes[0])+'番／2着 '+escapeHTML(finishes[1])+'番／3着 '+escapeHTML(finishes[2])+'番':
    finishes.length?finishes.map((x,i)=>(i+1)+'着 '+escapeHTML(x)+'番').join('／'):'着順未取得';
  const hit=r?.win_hit===true?
    '<span class="pos">🎯 的中</span>':r?.win_hit===false?
    '<span class="neg">❌ 不的中</span>':'<span>判定中</span>';
  const cost=num(r?.race_cost,0);
  const ret=num(r?.win_return,0);
  const profit=num(r?.race_profit,ret-cost);
  const status=textValue(r?.settlement_status,'決済状況未取得');
  return '<div class="box-section box-result">'+
    '<div class="section-heading">🏁 レース結果　'+hit+'</div>'+
    '<div>'+formatted+'</div>'+
    '<div>投資 '+yen(cost)+'／回収 '+yen(ret)+'／収支 <b class="'+(profit>=0?'pos':'neg')+'">'+(profit>0?'+':'')+yen(profit)+'</b></div>'+
    '<div class="horse-sub">決済：'+escapeHTML(status)+
    (r?.settlement_complete===true?'｜確定集計対象':'｜未確定の場合は集計対象外')+'</div>'+
    '</div>';
}
function renderRace(r){
  const finished=r?.is_finished===true;
  const category=r?.category==='local'?'地方':'中央';
  const top=Array.isArray(r?.top5)?r.top5:(Array.isArray(r?.horses)?r.horses:[]);
  const outsiders=Array.isArray(r?.outsiders)?r.outsiders:[];
  const longshots=Array.isArray(r?.longshots)?r.longshots:[];
  const topHTML=top.slice(0,5).map(renderHorseLine).join('')||
    '<div class="empty-note">予想データ未取得</div>';
  const outsiderHTML=outsiders.length?
    '<div class="box-section box-outsider"><div class="section-heading">💡 穴馬候補</div>'+
    outsiders.slice(0,3).map(h=>renderValueHorse(h,'穴馬','')).join('')+'</div>':'';
  const longshotHTML=longshots.length?
    '<div class="box-section box-longshot"><div class="section-heading">🚀 大穴候補</div>'+
    longshots.slice(0,3).map(h=>renderValueHorse(h,'大穴','purple')).join('')+'</div>':'';
  const date=textValue(r?.date,'');
  const surface=textValue(r?.surface,'未取得');
  const distance=r?.distance_m?textValue(r.distance_m)+'m':'距離未取得';
  const runners=num(r?.runner_count,0);
  const post=textValue(r?.post_time,'未取得');
  const evHTML='<div class="box-section box-ev"><div class="section-heading">📈 推定勝率・期待回収率</div>'+
    renderEVTable(r)+'</div>';
  const oddsHTML='<div class="box-section box-odds"><div class="section-heading">📉 オッズ変動</div>'+
    renderOddsMovement(r)+'</div>';
  const previousHTML='<div class="box-section box-form"><div class="section-heading">📋 前走データ</div>'+
    (top.slice(0,5).map(h=>{
      const content=renderPreviousForm(h);
      return content?'<div class="horse-row"><b>'+escapeHTML(horseNo(h))+'番 '+escapeHTML(horseName(h))+'</b>'+content+'</div>':'';
    }).filter(Boolean).join('')||'<div class="empty-note">前走着順・通過順・上がり3Fは、bot.pyが取得した項目のみ表示します。</div>')+
    '</div>';
  return '<article class="race-card '+(finished?'finished':'')+'">'+
    '<div class="race-header"><div class="race-heading">'+
    '<span class="tag-cat">'+category+'競馬</span>'+
    '<h3 class="race-title">'+escapeHTML(textValue(r?.race_no,''))+'R '+escapeHTML(textValue(r?.name,'レース名未取得'))+'</h3>'+
    '</div><span class="badge-status '+(finished?'finished-badge':'upcoming')+'">'+
    (finished?'レース終了':'発走前')+'</span></div>'+
    '<div class="race-meta">'+escapeHTML(r?.course??'競馬場未取得')+
    '｜発走 '+escapeHTML(post)+'｜'+escapeHTML(surface)+' '+escapeHTML(distance)+
    '｜出走 '+runners+'頭'+(date?'｜'+escapeHTML(date):'')+'</div>'+
    '<div class="box-section box-top3"><div class="section-heading">🏆 AI評価 上位5頭</div>'+
    topHTML+'</div>'+
    outsiderHTML+longshotHTML+evHTML+previousHTML+oddsHTML+
    '<div class="box-section"><div class="section-heading">🎟️ 紙上シミュレーション買い目</div>'+
    renderTickets(r)+'</div>'+
    renderResult(r)+
    '</article>';
}
function render(){
  if(!data||typeof data!=='object'){
    $('races').innerHTML='<div class="status-message error">データがありません。GitHub Actionsの実行結果を確認してください。</div>';
    return;
  }
  renderStats();
  const list=currentTab==='today'?data.races:data.tomorrow_races;
  const target=Array.isArray(list)?list:[];
  const filtered=target.filter(r=>currentCat==='all'||r?.category===currentCat);
  const totalToday=Array.isArray(data.races)?data.races.length:0;
  const totalTomorrow=num(data.tomorrow_race_count,Array.isArray(data.tomorrow_races)?data.tomorrow_races.length:0);
  $('data-status').textContent='更新：'+textValue(data.generated_at,'時刻未取得')+
    '｜本日 '+totalToday+'レース｜翌日全 '+totalTomorrow+'レース';
  if(!filtered.length){
    $('races').innerHTML='<div class="status-message">該当するレースはありません。<br>'+
      '一覧取得に失敗していないか、bot.pyのwarningsとActionsログを確認してください。</div>';
    return;
  }
  $('races').innerHTML=filtered.map(renderRace).join('');
}
async function updatePV(){
  try{
    const response=await fetch('https://counterapi.dev/v1/bagen-keiba-app/visits/up',{cache:'no-store'});
    if(!response.ok)throw new Error('PV unavailable');
    const result=await response.json();
    $('pv-count').textContent=result?.count!==undefined?
      num(result.count,0).toLocaleString('ja-JP'):'—';
  }catch(e){$('pv-count').textContent='—';}
}
async function fetchJSON(path){
  const response=await fetch(path+'?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error(path+' HTTP '+response.status);
  return await response.json();
}
async function init(){
  if(loading)return;
  loading=true;
  const button=$('refresh-btn');
  const container=$('races');
  button.disabled=true;button.textContent='読込中…';
  updatePV();
  if(!data)container.innerHTML='<div class="status-message">データを読み込み中…</div>';
  try{
    let loaded=null,lastError=null;
    for(const path of ['./docs/data.json','./data.json']){
      try{loaded=await fetchJSON(path);break;}catch(e){lastError=e;}
    }
    if(!loaded||typeof loaded!=='object')throw lastError||new Error('JSONがありません');
    data=loaded;
    render();
  }catch(e){
    console.error('データ読込エラー',e);
    container.innerHTML='<div class="status-message error"><b>データを読み込めませんでした。</b><br>'+
      'GitHub Actionsが成功しているか、data.jsonが公開されているか確認してください。'+
      '<br><br>詳細：'+escapeHTML(e?.message||'不明なエラー')+'</div>';
  }finally{
    loading=false;button.disabled=false;button.textContent='↻ 更新';
  }
}
init();
</script>
</body>
</html>
